<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed — SkillMatch</title>
<style>
  :root{
    --teal:#0f766e;--teal-dark:#0b5e57;--teal-light:#ccfbf1;
    --ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--bg:#fff;--panel:#f9fafb;
    --err:#dc2626;--err-bg:#fef2f2;--err-line:#fecaca;
  }
  @media (prefers-color-scheme:dark){
    :root{--teal:#2dd4bf;--teal-dark:#5eead4;--teal-light:#0f2e2b;
          --ink:#ececee;--sub:#9aa0aa;--line:#2c2f35;--bg:#141517;--panel:#1e2024;
          --err:#fca5a5;--err-bg:#3b1212;--err-line:#7f1d1d;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.55;}

  header{display:flex;align-items:center;justify-content:space-between;
         padding:14px 28px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:var(--bg);z-index:10;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;
         text-decoration:none;color:var(--ink);}
  .logo{width:32px;height:32px;border-radius:8px;background:var(--teal);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .logout{border:1px solid var(--line);background:transparent;color:var(--ink);
          padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;}
  .logout:hover{border-color:var(--teal);color:var(--teal);}

  main{max-width:640px;margin:0 auto;padding:36px 24px 60px;}
  h1{font-size:26px;margin:0 0 6px;}
  .lede{color:var(--sub);font-size:14.5px;margin:0 0 24px;}

  .err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line);
       border-radius:8px;padding:9px 12px;font-size:13.5px;margin:0 0 16px;display:none;}

  .composer{border:1px solid var(--line);border-radius:12px;padding:18px 20px;
            margin-bottom:22px;background:var(--bg);}
  .composer h2{font-size:15px;margin:0 0 10px;}
  .composer textarea{width:100%;min-height:80px;border:1px solid var(--line);
                     border-radius:9px;padding:11px 13px;font-size:14px;
                     font-family:inherit;outline:none;resize:vertical;
                     background:var(--bg);color:var(--ink);}
  .composer textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .composer-foot{display:flex;justify-content:space-between;align-items:center;
                 margin-top:10px;gap:10px;flex-wrap:wrap;}
  .composer-foot .hint{color:var(--sub);font-size:12.5px;}
  .btn-post{background:var(--teal);color:#fff;border:none;border-radius:8px;
            padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;
            font-family:inherit;}
  .btn-post:hover{background:var(--teal-dark);}
  .btn-post:disabled{opacity:.5;cursor:not-allowed;}

  .post{border:1px solid var(--line);border-radius:12px;padding:18px 20px;
        margin-bottom:14px;background:var(--bg);}
  .post-head{margin-bottom:8px;}
  .post-head a{color:inherit;text-decoration:none;}
  .post-head a:hover .name{color:var(--teal);}
  .post-head .name{font-weight:700;font-size:14.5px;}
  .post-head .role{color:var(--sub);font-size:13px;}
  .post-body{font-size:14.5px;line-height:1.6;white-space:pre-wrap;
             word-wrap:break-word;overflow-wrap:anywhere;margin-bottom:12px;}
  .like-row{margin-bottom:12px;}
  .like-btn{background:none;border:none;cursor:pointer;color:var(--sub);
            font-size:13.5px;display:inline-flex;align-items:center;gap:6px;
            padding:4px 2px;font-family:inherit;}
  .like-btn:hover{color:var(--ink);}
  .like-btn.liked{color:var(--teal-dark);font-weight:700;}

  .comments{border-top:1px solid var(--line);padding-top:10px;}
  .comment{font-size:13.5px;margin-bottom:6px;line-height:1.5;
           word-wrap:break-word;overflow-wrap:anywhere;}
  .comment b{font-weight:700;}
  .comment-input{width:100%;border:1px solid var(--line);border-radius:9px;
                 padding:9px 13px;font-size:13.5px;outline:none;
                 background:var(--bg);color:var(--ink);margin-top:6px;font-family:inherit;}
  .comment-input:focus{border-color:var(--teal);}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;
         text-align:center;color:var(--sub);font-size:14px;background:var(--panel);}
  .empty a{color:var(--teal);text-decoration:none;font-weight:600;}
  .empty a:hover{text-decoration:underline;}

  footer{border-top:1px solid var(--line);padding:20px 28px;text-align:center;
         font-size:13px;color:var(--sub);margin-top:48px;}

  @media (max-width:560px){
    header{padding:12px 16px;}
    main{padding:24px 16px 48px;}
  }

  /* ---------- shared nav ---------- */
  nav.desktop-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  nav.desktop-nav a{color:var(--ink);text-decoration:none;font-size:14px;}
  nav.desktop-nav a:hover{color:var(--teal);}
  nav.desktop-nav a.has-dot{position:relative;}
  nav.desktop-nav a .dot{
    position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;
    background:#ef4444;display:inline-block;box-shadow:0 0 0 2px var(--bg);
  }
  nav.desktop-nav a.bell{position:relative;font-size:15px;}
  nav.desktop-nav a.bell .badge-count{
    position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 0 0 2px var(--bg);
  }

  /* ---------- mobile: hamburger + drawer ---------- */
  .hamburger{display:none;background:none;border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;padding:8px;cursor:pointer;flex-direction:column;
    justify-content:space-between;align-items:center;}
  .hamburger span{display:block;width:100%;height:2px;background:var(--ink);border-radius:1px;}
  .hamburger:hover{border-color:var(--teal);}

  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(280px,80vw);
    background:var(--bg);border-left:1px solid var(--line);z-index:50;
    transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;padding:16px;gap:4px;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .drawer-title{font-weight:700;font-size:15px;}
  .drawer-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);}
  .drawer a{color:var(--ink);text-decoration:none;font-size:15px;padding:10px 8px;
    border-radius:8px;position:relative;display:flex;align-items:center;justify-content:space-between;}
  .drawer a:hover{background:var(--panel);color:var(--teal);}
  .drawer a .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;}
  .drawer .drawer-logout{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;}

  @media (max-width:720px){
    nav.desktop-nav{display:none;}
    .hamburger{display:flex;}
  }
  @media (min-width:721px){
    .drawer,.drawer-backdrop,.hamburger{display:none !important;}
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="/"><span class="logo">SM</span> SkillMatch</a>
  {% include "_nav.html" %}
  <!-- <a class="logout" href="/logout">Log out</a> -->
</header>

<main>
  <h1>Feed</h1>
  <p class="lede">Updates from you and the people you're connected with.</p>

  <p id="errBox" class="err"></p>

  <div class="composer">
    <h2>Share an update</h2>
    <textarea id="postInput" placeholder="Share an update with your network…" maxlength="2000"></textarea>
    <div class="composer-foot">
      <span class="hint">Plain text only — line breaks are preserved.</span>
      <button class="btn-post" id="postBtn">Post</button>
    </div>
  </div>

  <div id="postsList"></div>
</main>

<footer>SkillMatch — explainable, skill-based job matching with a lightweight professional network.</footer>

<script>
const $ = id => document.getElementById(id);
const errBox = $('errBox');
const postInput = $('postInput');
const postBtn = $('postBtn');
const postsList = $('postsList');

function showErr(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
function clearErr(){ errBox.style.display = 'none'; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPosts(list){
  if (!list || !list.length){
    postsList.innerHTML = `
      <div class="empty">
        Nothing here yet. Share your first update above, or connect with people
        from <a href="/network">Network</a> to see their posts.
      </div>`;
    return;
  }
  postsList.innerHTML = list.map(p => `
    <div class="post" data-id="${p.post_id}">
      <div class="post-head">
        <a href="/u/${p.user_id}">
          <span class="name">${escapeHtml(p.full_name)}</span>
        </a>
        ${p.headline ? ` · <span class="role">${escapeHtml(p.headline)}</span>` : ''}
      </div>
      <div class="post-body">${escapeHtml(p.content)}</div>
      <div class="like-row">
        <button class="like-btn ${p.liked_by_me ? 'liked' : ''}" data-like="${p.post_id}"
                aria-pressed="${p.liked_by_me ? 'true' : 'false'}">
          ${p.liked_by_me ? '♥' : '♡'} ${p.likes} like${p.likes === 1 ? '' : 's'}
        </button>
      </div>
      <div class="comments">
        ${p.comments.map(c =>
          `<div class="comment"><b>${escapeHtml(c.full_name)}:</b> ${escapeHtml(c.content)}</div>`
        ).join('')}
        <input type="text" class="comment-input" data-comment="${p.post_id}"
               placeholder="Write a comment and press Enter" maxlength="500">
      </div>
    </div>`).join('');
  wireEvents();
}

function wireEvents(){
  document.querySelectorAll('[data-like]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.like;
    try {
      const r = await fetch('/api/feed/' + id + '/like', {method: 'POST'});
      if (!r.ok){ showErr('Could not update like.'); return; }
      clearErr();
      load();
    } catch { showErr('Network error.'); }
  }));

  document.querySelectorAll('[data-comment]').forEach(inp => inp.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const text = inp.value.trim();
    if (!text) return;
    const id = inp.dataset.comment;
    try {
      const r = await fetch('/api/feed/' + id + '/comments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: text}),
      });
      if (!r.ok){
        const d = await r.json().catch(() => ({}));
        showErr(d.error || 'Could not post comment.');
        return;
      }
      clearErr();
      load();
    } catch { showErr('Network error.'); }
  }));
}

async function load(){
  try {
    const r = await fetch('/api/feed');
    if (!r.ok){ showErr('Could not load feed.'); return; }
    const list = await r.json();
    renderPosts(list);
  } catch { showErr('Network error loading feed.'); }
}

postBtn.addEventListener('click', async () => {
  const text = postInput.value.trim();
  if (!text) return;
  postBtn.disabled = true;
  try {
    const r = await fetch('/api/feed', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: text}),
    });
    if (!r.ok){
      const d = await r.json().catch(() => ({}));
      showErr(d.error || 'Could not post.');
      postBtn.disabled = false;
      return;
    }
    postInput.value = '';
    clearErr();
    load();
  } catch { showErr('Network error.'); }
  postBtn.disabled = false;
});

load();
</script>

<!-- Drawer script — must run AFTER the body content exists. -->
<script>
(function(){
  const btn = document.getElementById('hamburgerBtn');
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const closeBtn = document.getElementById('drawerClose');
  if (!btn || !drawer || !backdrop) return;
  function open(){
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    backdrop.hidden = false;
    btn.setAttribute('aria-expanded','true');
  }
  function close(){
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    backdrop.hidden = true;
    btn.setAttribute('aria-expanded','false');
  }
  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
})();
</script>
</body></html>
