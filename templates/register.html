<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create your account — SkillMatch</title>
<style>
  :root{
    --teal:#0f766e;--teal-dark:#0b5e57;--ink:#1f2937;--sub:#6b7280;
    --line:#e5e7eb;--bg:#fff;--err:#dc2626;--err-bg:#fef2f2;--err-line:#fecaca;
  }
  @media (prefers-color-scheme:dark){
    :root{--teal:#2dd4bf;--teal-dark:#5eead4;--ink:#f3f4f6;--sub:#9ca3af;
          --line:#374151;--bg:#111827;--err:#fca5a5;--err-bg:#3b1212;--err-line:#7f1d1d;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);
       display:flex;flex-direction:column;align-items:center;
       padding:56px 20px 40px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:32px;}
  .logo{width:56px;height:56px;border-radius:14px;background:var(--teal);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
  .brand span{font-weight:700;font-size:16px;}
  .card{width:100%;max-width:420px;border:1px solid var(--line);
        border-radius:14px;padding:32px;background:var(--bg);}
  h1{font-size:26px;margin:0 0 10px;text-align:center;}
  .lede{color:var(--sub);font-size:14px;text-align:center;line-height:1.5;margin:0 0 28px;}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .field{margin-bottom:18px;}
  input[type="text"],input[type="email"],input[type="password"]{
    width:100%;border:1px solid var(--line);border-radius:8px;
    padding:11px 12px;font-size:14px;outline:none;background:var(--bg);color:var(--ink);}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15);}
  .helper{font-size:12.5px;color:var(--sub);margin:6px 0 0;}
  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:8px;
       padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  .btn:hover{background:var(--teal-dark);}
  .form-error{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line);
              border-radius:8px;padding:9px 12px;font-size:13.5px;margin:0 0 18px;}
  .switch{text-align:center;font-size:14px;color:var(--sub);margin-top:22px;}
  .switch a{color:var(--teal);text-decoration:none;font-weight:600;}
  .switch a:hover{text-decoration:underline;}

  /* ---------- shared nav ---------- */
nav.desktop-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
nav.desktop-nav a{color:var(--ink);text-decoration:none;font-size:14px;}
nav.desktop-nav a:hover{color:var(--teal);}
nav.desktop-nav a.active{color:var(--teal-dark);background:var(--teal-light);padding:6px 10px;border-radius:999px;}
nav.desktop-nav a.has-dot{position:relative;}
nav.desktop-nav a .dot{
  position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;
  background:#ef4444;display:inline-block;box-shadow:0 0 0 2px var(--bg);
}
nav.desktop-nav a.bell{position:relative;font-size:15px;}
nav.desktop-nav a.bell .badge-count{
  position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 0 0 2px var(--bg);
}

/* ---------- mobile: hamburger + drawer ---------- */
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:8px;
  width:38px;height:38px;padding:8px;cursor:pointer;flex-direction:column;
  justify-content:space-between;align-items:center;}
.hamburger span{display:block;width:100%;height:2px;background:var(--ink);border-radius:1px;}
.hamburger:hover{border-color:var(--teal);}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(280px,80vw);
  background:var(--bg);border-left:1px solid var(--line);z-index:50;
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;padding:16px;gap:4px;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.drawer-title{font-weight:700;font-size:15px;}
.drawer-close{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);}
.drawer a{color:var(--ink);text-decoration:none;font-size:15px;padding:10px 8px;
  border-radius:8px;position:relative;display:flex;align-items:center;justify-content:space-between;}
.drawer a:hover{background:var(--panel);color:var(--teal);}
.drawer a .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;}
.drawer .drawer-logout{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;}

@media (max-width:720px){
  nav.desktop-nav{display:none;}
  .hamburger{display:flex;}
}
@media (min-width:721px){
  .drawer,.drawer-backdrop,.hamburger{display:none !important;}
}
</style>
</head>
<script>
(function(){
  const btn = document.getElementById('hamburgerBtn');
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const closeBtn = document.getElementById('drawerClose');
  if (!btn || !drawer || !backdrop) return;

  function open(){
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    backdrop.hidden = false;
    btn.setAttribute('aria-expanded','true');
  }
  function close(){
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    backdrop.hidden = true;
    btn.setAttribute('aria-expanded','false');
  }

  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
})();
</script>
<body>

  <div class="brand">
    <div class="logo">SM</div>
    <span>SkillMatch</span>
  </div>

  <div class="card">
    <h1>Create your account</h1>
    <p class="lede">Get job recommendations based on the skills you have — and see what to learn next.</p>

    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="name" type="text" placeholder="e.g. Adaeze Okafor" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="At least 6 characters" minlength="6" required>
        <p class="helper">Use at least 6 characters.</p>
      </div>

      <button class="btn" type="submit">Create account</button>
    </form>

    <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
  </div>

</body></html>
